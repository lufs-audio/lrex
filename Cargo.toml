[package]
name = "lufs-recorder"
version = "0.5.1"
edition = "2021"
rust-version = "1.74"
description = "Universal, agent-first CLI (lufs-recorder / lrex) for recording any audio device's channels plus MIDI to a verified take."
license = "GPL-3.0-or-later"
repository = "https://github.com/lufs-audio/lrex"
authors = ["Daniel Ramirez <danialrami>"]
readme = "README.md"
keywords = ["audio", "midi", "recording", "cli", "multichannel"]
categories = ["command-line-utilities", "multimedia::audio"]

# NOTE (2026-08-21): the GitHub repo itself was renamed lufs-audio/lufs-recorder
# -> lufs-audio/lrex shortly after this alias shipped (same repo id, confirmed
# via GitHub search, not a new/separate repo). Updated the URL above to match.
# The Cargo [package] name below is deliberately UNCHANGED pending Daniel's
# call on whether it should also become "lrex" -- flagged, not assumed either
# way. Two binary targets ship the identical CLI under two invocation names —
# see src/bin/lufs-recorder.rs and src/bin/lrex.rs (the short, bplate-compliant
# alias: lufs-audio/bplate docs/units/07-lufs-primitive-cli-naming.md). Both
# are auto-discovered by Cargo's src/bin/*.rs convention; no [[bin]] needed.
# src/lib.rs holds the shared implementation both binaries call into.

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

# Audio + MIDI backends (v0.2 — single-device capture with MIDI, maxpatch parity).
cpal = "0.15"          # cross-platform device I/O (CoreAudio / WASAPI / ALSA / JACK)
hound = "3.5"          # WAV writing/reading
midir = "0.10"         # cross-platform MIDI input
midly = "0.5"          # Standard MIDI File (SMF) writer

# Config, paths, ids, timing, real-time plumbing.
toml = "0.8"
dirs = "5"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ringbuf = "0.4"        # lock-free SPSC ring buffer: audio callback -> writer thread
ctrlc = "3"            # clean stop on Ctrl-C, so an interrupted take still finalizes

# `serve` uses only std::net for HTTP (no web framework) to stay self-contained.
# `tui` (ratatui) is the interactive terminal client of that same HTTP+SSE API —
# a consumer, not a second capture pipeline. See src/tui/mod.rs.
ratatui = "0.29"
crossterm = "0.28"

# libc is only for sending SIGINT to the record subprocess so it finalizes cleanly.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
