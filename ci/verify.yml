name: CI

on:
  push:
    branches: [main]
    tags: ['v*']          # a version tag also runs the macOS build
  pull_request:
    branches: [main]
  workflow_dispatch:       # ...and you can trigger the macOS build by hand

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    # fork-PR guard: never run untrusted fork code on the self-hosted fleet
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, lufs]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
        with: { components: rustfmt }
      - run: cargo fmt --all --check

  linux:
    # fork-PR guard: never run untrusted fork code on the self-hosted fleet
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, lufs]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Install ALSA/JACK dev headers + build tools
        run: apt-get update && apt-get install -y build-essential pkg-config libasound2-dev libjack-jackd2-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      - run: cargo clippy --all-targets --all-features
      - run: cargo build --verbose
      - run: cargo test --verbose

  macos:
    # No self-hosted Mac in the fleet, so this runs on GitHub-hosted macOS, which
    # bills at 10x. Gated to manual runs and version tags so it NEVER fires on a
    # normal push/PR — that 10x-per-push burn was the whole reason we're here.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      - run: cargo clippy --all-targets --all-features
      - run: cargo build --verbose
      - run: cargo test --verbose
